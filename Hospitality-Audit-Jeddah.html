  <style>

    /* =========================================
       GENERAL
    ========================================= */

    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }


    /* =========================================
       NAVBAR
    ========================================= */

    .navbar-custom {
      background: #ffffff;
      padding: 12px 0;
      box-shadow: 0 2px 15px rgba(0, 0, 0, 0.08);
      z-index: 1050;
    }


    .navbar-brand {
      color: #222;
      font-weight: 600;
      letter-spacing: 0.5px;
    }


    .navbar-brand:hover {
      color: #b08a3c;
    }


    .nav-link {
      color: #222 !important;
      font-size: 15px;
      font-weight: 500;
      padding: 10px 14px !important;
      transition: 0.3s;
    }


    .nav-link:hover {
      color: #b08a3c !important;
    }

    #aboutBtn.dropdown-toggle::after,
    #whatWeDoBtn.dropdown-toggle::after {
      display: none !important;
    }


    /* =========================================
       MAIN OUR HOTELS DROPDOWN
    ========================================= */

    .hotel-dropdown {
      min-width: 250px;
      padding: 8px 0;

      border: none;
      border-radius: 8px;

      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.15);
    }


    .hotel-dropdown .dropdown-item {
      padding: 11px 18px;
      font-size: 14px;
      color: #222;

      transition: 0.3s;
    }

    .hotel-dropdown a,
    .hotel-dropdown a.dropdown-item {
      color: #222;
    }


    .hotel-dropdown a:hover,
    .hotel-dropdown .dropdown-item:hover {
      background: #f8f5ed;
      color: #b08a3c;
    }


    /* =========================================
       LOCATION SUBMENU
    ========================================= */

    .dropdown-submenu {
      position: relative;
    }


    .dropdown-submenu > .dropdown-menu {

      top: 0;
      left: 100%;

      margin-top: -8px;
      margin-left: 2px;

      min-width: 290px;

      border: none;
      border-radius: 8px;

      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.15);
    }


    /*
       IMPORTANT:
       No hover opening.
       Javascript controls everything.
    */

    .dropdown-submenu > .dropdown-menu.show {
      display: block;
    }


    /* =========================================
       ARROWS
    ========================================= */

    .dropdown-submenu > .dropdown-toggle::after {

      float: right;

      margin-top: 7px;
    }


    /* =========================================
       GOLD BUTTON
    ========================================= */

    .btn-gold {

      background: #b08a3c;

      border: 1px solid #b08a3c;

      color: #ffffff;

      border-radius: 4px;

      transition: 0.3s;
    }


    .btn-gold:hover {

      background: #92702e;

      border-color: #92702e;

      color: #ffffff;
    }


    /* =========================================
       THREE LINE BUTTON
    ========================================= */

    .side-menu-btn {

      width: 46px;
      height: 46px;

      border: 1px solid #ddd;

      background: #ffffff;

      display: flex;

      align-items: center;

      justify-content: center;

      border-radius: 4px;

      cursor: pointer;

      transition: 0.3s;
    }


    .side-menu-btn i {

      font-size: 25px;

      color: #222;
    }


    .side-menu-btn:hover {

      background: #b08a3c;

      border-color: #b08a3c;
    }


    .side-menu-btn:hover i {

      color: #ffffff;
    }


    /* =========================================
       RIGHT SIDE SLIDER
    ========================================= */

    .side-offcanvas {

      width: 420px !important;

      background: #ffffff;
    }


    .side-offcanvas .offcanvas-header {

      padding: 25px 30px;

      border-bottom: 1px solid #eeeeee;
    }


    .side-offcanvas .offcanvas-title {

      font-size: 21px;

      font-weight: 600;

      color: #222;
    }


    .side-offcanvas .offcanvas-body {

      padding: 30px;
    }


    /* =========================================
       SIDE MENU
    ========================================= */

    .side-menu {

      list-style: none;

      padding: 0;

      margin: 0;
    }


    .side-menu > li {

      border-bottom: 1px solid #eeeeee;
    }


    .side-menu > li > a {

      display: flex;

      align-items: center;

      justify-content: space-between;

      text-decoration: none;

      color: #222;

      font-size: 16px;

      font-weight: 500;

      padding: 17px 5px;

      transition: 0.3s;
    }


    .side-menu > li > a:hover {

      color: #b08a3c;
    }


    .side-about-menu a,
    .side-about-menu a:link,
    .side-about-menu a:visited {

      color: #000000;
    }


    /* =========================================
       SIDE HOTEL LOCATIONS
    ========================================= */

    .side-hotel-location {

      border-top: 1px solid #eeeeee;
    }


    .side-hotel-location > button {

      width: 100%;

      border: 0;

      background: transparent;

      display: flex;

      align-items: center;

      justify-content: space-between;

      padding: 14px 10px;

      color: #333;

      font-size: 15px;

      font-weight: 600;

      cursor: pointer;

      text-align: left;
    }


    .side-hotel-location > button:hover {

      color: #b08a3c;

      background: #faf8f2;
    }


    /* =========================================
       SIDE HOTEL LIST
    ========================================= */

    .side-hotel-list {

      display: none;

      background: #fafafa;

      padding: 5px 15px 12px 25px;
    }


    .side-hotel-list.show {

      display: block;
    }


    .side-hotel-list a {

      display: flex;

      align-items: center;

      justify-content: space-between;

      text-decoration: none;

      color: #555;

      font-size: 14px;

      padding: 10px 0;

      transition: 0.3s;
    }


    .side-hotel-list a:hover {

      color: #b08a3c;

      padding-left: 5px;
    }


    /* =========================================
       CONTACT
    ========================================= */

    .side-contact {

      margin-top: 35px;
    }


    .side-contact h6 {

      color: #b08a3c;

      font-size: 13px;

      text-transform: uppercase;

      letter-spacing: 1px;

      margin-bottom: 18px;
    }


    .side-contact p {

      margin-bottom: 12px;

      color: #555;

      font-size: 14px;
    }


    .side-contact a {

      color: #333;

      text-decoration: none;
    }


    .side-contact a:hover {

      color: #b08a3c;
    }


    /* =========================================
       SOCIAL
    ========================================= */

    .side-social {

      display: flex;

      gap: 12px;

      margin-top: 25px;
    }


    .side-social a {

      width: 38px;
      height: 38px;

      border: 1px solid #ddd;

      display: flex;

      align-items: center;

      justify-content: center;

      color: #333;

      text-decoration: none;

      border-radius: 50%;

      transition: 0.3s;
    }


    .side-social a:hover {

      background: #b08a3c;

      border-color: #b08a3c;

      color: #ffffff;
    }


    /* =========================================
       MOBILE
    ========================================= */

    @media (max-width: 991px) {

      .navbar-custom {

        padding: 10px 15px;
      }


      .navbar-collapse {

        margin-top: 15px;
      }


      .nav-link {

        padding: 12px 5px !important;
      }


      /*
        Main dropdown becomes normal
        vertical menu on mobile
      */

      .hotel-dropdown {

        box-shadow: none;

        border-radius: 0;

        padding-left: 10px;
      }


      .dropdown-submenu > .dropdown-menu {

        position: static;

        margin: 0;

        box-shadow: none;

        border-radius: 0;

        padding-left: 15px;

        background: #fafafa;
      }


      .side-offcanvas {

        width: 85% !important;

        max-width: 420px;
      }

    }


    @media (max-width: 576px) {

      .side-offcanvas {

        width: 100% !important;
      }

    }

    @media (max-width: 991.98px) {
      .desktop-slide-trigger,
      .desktop-only-slide-menu {
        display: none !important;
      }
    }

          overflow-wrap: anywhere;
        }
      }

</head>

<script>

document.addEventListener("DOMContentLoaded", function () {


  /* ==================================================
     MAIN NAVBAR
     OUR HOTELS OPEN / CLOSE
  ================================================== */

  const mainHotelMenu =
    document.getElementById("mainHotelMenu");

  const ourBrandsBtn =
    document.getElementById("ourBrandsBtn");

  const ourBrandsMenu =
    ourBrandsBtn.nextElementSibling;

  /* ==================================================
     CLOSE MAIN LOCATION MENUS
  ================================================== */

  function closeMainLocationMenus() {

    document
      .querySelectorAll(
        "#mainHotelMenu .dropdown-submenu .dropdown-menu"
      )
      .forEach(function (menu) {

        menu.classList.remove("show");

      });

  }



  /* ==================================================
     CLICK OUTSIDE MAIN MENU
  ================================================== */

  document.addEventListener("click", function (e) {

    if (!ourBrandsBtn.parentElement.contains(e.target)) {
      ourBrandsMenu.classList.remove("show");
      ourBrandsBtn.setAttribute("aria-expanded", "false");
    }

    const navbar =
      document.getElementById("navbar");


    if (!navbar.contains(e.target)) {

      mainHotelMenu.classList.remove("show");

      closeMainLocationMenus();

    }

  });



  /* ==================================================
     SIDE MENU
     OUR HOTELS OPEN / CLOSE
  ================================================== */

  const sideHotelsBtn =
    document.getElementById("sideHotelsBtn");

  const sideHotelsMenu =
    document.getElementById("sideHotelsMenu");

  const sideHotelsIcon =
    document.getElementById("sideHotelsIcon");

  const sideAboutBtn =
    document.getElementById("sideAboutBtn");

  const sideAboutMenu =
    document.getElementById("sideAboutMenu");

  const sideAboutIcon =
    document.getElementById("sideAboutIcon");

  const sideWhatWeDoBtn = document.getElementById("sideWhatWeDoBtn");
  const sideWhatWeDoMenu = document.getElementById("sideWhatWeDoMenu");
  const sideWhatWeDoIcon = document.getElementById("sideWhatWeDoIcon");

  sideAboutBtn.addEventListener("click", function () {
    const isOpen = sideAboutMenu.style.display === "block";
    sideAboutMenu.style.display = isOpen ? "none" : "block";
    sideAboutIcon.className = isOpen ? "bi bi-chevron-down" : "bi bi-chevron-up";
    sideAboutBtn.setAttribute("aria-expanded", String(!isOpen));
  });

  sideAboutMenu.querySelectorAll("a").forEach(function (link) {
    link.addEventListener("click", function () {
      sideAboutMenu.style.display = "none";
      sideAboutIcon.className = "bi bi-chevron-down";
      sideAboutBtn.setAttribute("aria-expanded", "false");
    });
  });

  sideWhatWeDoBtn.addEventListener("click", function () {
    const isOpen = sideWhatWeDoMenu.style.display === "block";
    sideWhatWeDoMenu.style.display = isOpen ? "none" : "block";
    sideWhatWeDoIcon.className = isOpen ? "bi bi-chevron-down" : "bi bi-chevron-up";
    sideWhatWeDoBtn.setAttribute("aria-expanded", String(!isOpen));
  });

  sideWhatWeDoMenu.querySelectorAll("a").forEach(function (link) {
    link.addEventListener("click", function () {
      sideWhatWeDoMenu.style.display = "none";
      sideWhatWeDoIcon.className = "bi bi-chevron-down";
      sideWhatWeDoBtn.setAttribute("aria-expanded", "false");
    });
  });


  sideHotelsBtn.addEventListener("click", function () {


    const isOpen =
      sideHotelsMenu.style.display === "block";


    if (isOpen) {


      /*
         CLOSE
      */

      sideHotelsMenu.style.display = "none";

      sideHotelsIcon.className =
        "bi bi-chevron-down";


      closeSideLocationMenus();


    } else {


      /*
         OPEN
      */

      sideHotelsMenu.style.display = "block";

      sideHotelsIcon.className =
        "bi bi-chevron-up";

    }

  });



  /* ==================================================
     SIDE LOCATION MENUS
  ================================================== */

  const sideLocationButtons =
    document.querySelectorAll(
      "[data-side-location]"
    );


  sideLocationButtons.forEach(function (button) {


    button.addEventListener("click", function () {


      const targetId =
        this.getAttribute("data-side-location");


      const target =
        document.getElementById(targetId);


      const isOpen =
        target.classList.contains("show");


      /*
         Close all other locations
      */

      closeSideLocationMenus();


      /*
         If it was closed,
         open it.
         If it was open,
         it stays closed.
      */

      if (!isOpen) {

        target.classList.add("show");

        const icon =
          this.querySelector("i");

        icon.className =
          "bi bi-chevron-up";

      }

    });

  });



  /* ==================================================
     CLOSE SIDE LOCATION MENUS
  ================================================== */

  function closeSideLocationMenus() {


    document
      .querySelectorAll(".side-hotel-list")
      .forEach(function (menu) {

        menu.classList.remove("show");

      });


    document
      .querySelectorAll(
        ".side-hotel-location button i"
      )
      .forEach(function (icon) {

        icon.className =
          "bi bi-chevron-down";

      });

  }



  /* ==================================================
     RESET SIDE MENU WHEN CLOSED
  ================================================== */

  const sideMenu =
    document.getElementById("rightSideMenu");


  sideMenu.addEventListener(
    "hidden.bs.offcanvas",
    function () {

      sideAboutMenu.style.display = "none";
      sideAboutIcon.className = "bi bi-chevron-down";
      sideAboutBtn.setAttribute("aria-expanded", "false");

      sideWhatWeDoMenu.style.display = "none";
      sideWhatWeDoIcon.className = "bi bi-chevron-down";
      sideWhatWeDoBtn.setAttribute("aria-expanded", "false");

      sideHotelsMenu.style.display = "none";

      sideHotelsIcon.className =
        "bi bi-chevron-down";

      closeSideLocationMenus();

    }
  );


});

</script>
